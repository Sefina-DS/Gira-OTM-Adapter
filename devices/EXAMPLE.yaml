# =============================================================================
# EXAMPLE.yaml — Vorlage fuer einen Gira-Rauchmelder
# =============================================================================
# Kopiere diese Datei mit einem sprechenden Namen deiner Wahl in deinen
# ESPHome-Config-Ordner (nicht in devices/, sondern direkt in den Config-Root,
# damit das ESPHome-Dashboard sie sieht), z.B.:
#
#   cp devices/EXAMPLE.yaml Gira-RM_HG_EG_Flur.yaml
#
# Namens-Konvention:
#   Datei:         Gira-RM_<Standort_mit_Unterstrichen>.yaml
#   esphome.name:  gira-rm-<standort-mit-bindestrichen>  (lowercase, mDNS-safe)
#   friendly_name: "Gira-RM <Standort mit Leerzeichen>"
#
# Nach dem Kopieren: nur Werte unter 'substitutions:' anpassen — mehr ist im
# Regelfall nicht noetig. Alle Hardware-Details (UART, Pins, Debug-Logger,
# Component-Instanz) stecken im gemeinsamen Hardware-Template unter
# packages/gira_hardware.yaml und werden per !include eingebunden.
#
# secrets.yaml muss wifi_ssid, wifi_password, api_key, ota_password enthalten
# (siehe secrets.yaml.example im Repo-Root).
# =============================================================================

substitutions:
  device_name: gira-rm-standort-example       # z.B. gira-rm-hg-eg-flur
  friendly_name: "Gira-RM Standort Example"   # z.B. "Gira-RM HG EG Flur"
  update_interval: "60s"                      # Poll-Rhythmus der Component

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

packages:
  hardware: !include ../packages/gira_hardware.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG
  logs:
    gira_rauchmelder: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  version: 3
  local: true
